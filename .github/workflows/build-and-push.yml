name: Build and Push

on:
  workflow_dispatch:
    inputs:
      ref:
        description: "Git ref (commit SHA, tag, or branch)"
        required: true
        default: "main"
  push:
    branches: [ main ]
    tags: [ "*" ]

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.ref || github.ref }}
          fetch-depth: 1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile.test
          push: true
          tags: ghcr.io/dougvk/summarize:${{ github.event.inputs.ref || github.sha }}
          provenance: false

      - name: Done
        run: echo "Built and pushed ghcr.io/dougvk/summarize:${{ github.event.inputs.ref || github.sha }}"
